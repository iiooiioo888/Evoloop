# EvoLoop Docker Compose（Phase 8.3）
# 服务：frontend / backend / opc_service / redis / chroma
#
# 启动：docker compose up -d
# 构建：docker compose build --no-cache
# 查看日志：docker compose logs -f

services:
  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: evoloop-backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # 容器内使用服务名访问 Redis/Chroma
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      # 对话存檔寫入持久卷（避免鏡像重建後丟失）
      - EVOL_ARCHIVE_DIR=/app/data/archives
      # 運行時 LLM 配置持久化目錄
      - EVOL_CONFIG_DIR=/app/data
    depends_on:
      redis:
        condition: service_healthy
      chroma:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
    networks:
      - evoloop_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    # 生產版前端（nginx）：僅在 prod profile 啟用
    #   COMPOSE_PROFILES=prod docker compose -f docker-compose.yml up -d --build
    profiles: ["prod"]
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: evoloop-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - evoloop_net
    restart: unless-stopped

  opc_service:
    build:
      context: .
      dockerfile: ./opc_service/Dockerfile
    container_name: evoloop-opc
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      # 默认启用模拟 OPC 服务器（开发测试用）
      - OPC_SIM_ENABLED=true
      - OPC_SIM_PORT=4840
    volumes:
      - opc_audit_data:/app/opc_service/audit_logs
    networks:
      - evoloop_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/opc/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: evoloop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - evoloop_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    image: chromadb/chroma:latest
    container_name: evoloop-chroma
    ports:
      - "8100:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - evoloop_net
    restart: unless-stopped
    healthcheck:
      # 新版 Chroma 映像無 curl/python，改用 bash 內建 /dev/tcp 探測 v2 心跳端點
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8000 && printf 'GET /api/v2/heartbeat HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q 200 <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  backend_data:
  redis_data:
  chroma_data:
  opc_audit_data:

networks:
  evoloop_net:
    driver: bridge