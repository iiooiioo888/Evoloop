# EvoLoop 開發模式覆蓋配置
#
# 用法（已透過 .env 的 COMPOSE_FILE 設為預設，直接執行即可）：
#   docker compose up -d
#
# 效果：
#   - 後端 / OPC：原始碼卷掛載 + uvicorn --reload，改 Python 碼秒級熱重載
#   - 前端：frontend-dev 服務跑 vite dev（HMR），改 TSX 即時更新
#   ⇒ 更新代碼不再需要重建鏡像
#
# 注意：開發模式不包含生產版前端（nginx），如需生產前端：
#   COMPOSE_PROFILES=prod docker compose -f docker-compose.yml up -d --build
#
# 若要完整「生產模式」部署：
#   COMPOSE_PROFILES=prod docker compose -f docker-compose.yml up -d --build

services:
  # 禁用生产版前端（开发模式使用 vite HMR）
  frontend:
    profiles: ["disabled"]

  backend:
    volumes:
      # 原始碼掛載：改動即時生效（依賴不變時無需重建鏡像）
      - ./backend:/app/backend
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  opc_service:
    volumes:
      - ./opc_service:/app/opc_service
    command: ["uvicorn", "opc_service.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]

  # 开发版前端：vite dev server + HMR（默认启动）
  frontend-dev:
    image: node:20-alpine
    container_name: evoloop-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      # vite 代理指向 compose 網路內的後端服務名
      - VITE_PROXY_TARGET=http://backend:8000
    volumes:
      - ./frontend:/app
      # 以具名卷隔離 node_modules（容器為 alpine，不污染主機依賴）
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --no-audit --no-fund && npm run dev"]
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - evoloop_net
    restart: unless-stopped

volumes:
  frontend_node_modules:
